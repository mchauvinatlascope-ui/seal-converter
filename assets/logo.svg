<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="15" fill="#2d72d2"/>
  <!-- flippers, tucked under the head -->
  <path d="M17 44c-4 2-7 6-6.5 8.5.6 2.4 5 2 9.5-1.5z" fill="#cfe0f6"/>
  <path d="M47 44c4 2 7 6 6.5 8.5-.6 2.4-5 2-9.5-1.5z" fill="#cfe0f6"/>
  <!-- head: a smooth dome, wider at the cheeks -->
  <path d="M32 10c10.5 0 18.5 7.5 18.5 18.5 0 6.5-1.3 12-4.3 16C43 48.8 38 51.5 32 51.5s-11-2.7-14.2-7C14.8 40.5 13.5 35 13.5 28.5 13.5 17.5 21.5 10 32 10z" fill="#f4f8fd"/>
  <!-- muzzle -->
  <ellipse cx="32" cy="42" rx="11.5" ry="8" fill="#dce9f8"/>
  <!-- nose and mouth -->
  <path d="M32 35.6c3.1 0 5.3 1.7 5.3 3.5s-2.4 3.4-5.3 3.4-5.3-1.6-5.3-3.4 2.2-3.5 5.3-3.5z" fill="#1c2230"/>
  <path d="M32 42.5v3.2m0 0c0 2.1-1.7 3.4-3.8 3.4M32 45.7c0 2.1 1.7 3.4 3.8 3.4" fill="none" stroke="#1c2230" stroke-width="1.8" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#1c2230" stroke-width="1.4" stroke-linecap="round" opacity=".7">
    <path d="M21.5 39.5h-6M22 43.5l-5.5 2"/>
    <path d="M42.5 39.5h6M42 43.5l5.5 2"/>
  </g>
  <!-- geek glasses -->
  <g fill="none" stroke="#1c2230" stroke-width="3">
    <circle cx="23" cy="27.5" r="8" fill="#ffffff"/>
    <circle cx="41" cy="27.5" r="8" fill="#ffffff"/>
    <path d="M31 27.5h2" stroke-linecap="round"/>
    <path d="M15.2 25.2l-3.4-2.4M48.8 25.2l3.4-2.4" stroke-linecap="round"/>
  </g>
  <circle cx="23" cy="27.5" r="2.7" fill="#1c2230"/>
  <circle cx="41" cy="27.5" r="2.7" fill="#1c2230"/>
  <!-- tape on the bridge, the geek touch -->
  <rect x="30" y="24" width="4" height="7" rx="1.2" fill="#f6c84c" stroke="#1c2230" stroke-width="1.2"/>
</svg>
