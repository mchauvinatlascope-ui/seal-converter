<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seal Helper</title>
<style>
  :root { --bg:#fff; --fg:#1b1d21; --fg2:#5d626b; --fg3:#8f959f; --line:#e4e4e0; --on:#1b1d21; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1e22; --fg:#eceef1; --fg2:#a9afb9; --fg3:#7d8592; --line:#30333a; --on:#eceef1; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 310px; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header b { font-size: 14px; flex: 1; }
  header span { color: var(--fg2); font-size: 11.5px; }
  h2 { margin: 0; padding: 12px 14px 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg3); }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 14px; cursor: pointer; }
  .row div { flex: 1; }
  .row small { display: block; color: var(--fg2); font-size: 12px; }
  .off .row { opacity: .45; pointer-events: none; }
  input[type="checkbox"] { appearance: none; flex: none; width: 30px; height: 18px; margin: 1px 0 0; border-radius: 9px; background: var(--line); position: relative; cursor: pointer; transition: background .12s; }
  input[type="checkbox"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); transition: transform .12s; }
  input[type="checkbox"]:checked { background: var(--on); }
  input[type="checkbox"]:checked::after { transform: translateX(12px); }
  input[type="checkbox"]:focus-visible { outline: 2px solid #2d72d2; outline-offset: 2px; }
  footer { margin-top: 6px; padding: 10px 14px 12px; color: var(--fg2); font-size: 11.5px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <header><b>Seal Helper</b><span>v0.2</span><input type="checkbox" id="on" aria-label="Seal Helper on"></header>
  <div id="all">
    <h2>Layout</h2>
    <label class="row" for="side"><div>New sidebar<small>Home, My work, To publish and the lab lists in one simple bar. Ctrl K searches.</small></div><input type="checkbox" id="side"></label>
    <label class="row" for="home"><div>Open on Home<small>Your work and changes to publish first; the lab guide is one click away.</small></div><input type="checkbox" id="home"></label>
    <label class="row" for="props"><div>Record header and outline<small>Key fields at the top of a record, its headings on the right.</small></div><input type="checkbox" id="props"></label>
    <h2>Clean up</h2>
    <label class="row" for="doc"><div>Clean documents<small>Change bars on hover, dash lines as a thin rule, table header row.</small></div><input type="checkbox" id="doc"></label>
    <label class="row" for="dates"><div>Short dates and titles<small>No time zone on every date, no repeated change number.</small></div><input type="checkbox" id="dates"></label>
    <label class="row" for="info"><div>Info panel closed<small>Closed when you open a record; open it whenever you need it.</small></div><input type="checkbox" id="info"></label>
    <label class="row" for="quiet"><div>Quieter lists<small>Empty changes and Untitled or test drafts dimmed, never hidden.</small></div><input type="checkbox" id="quiet"></label>
  </div>
  <footer>Only changes how Seal looks in this browser. Nothing is written to Seal or sent anywhere.</footer>
  <script src="popup.js"></script>
</body>
</html>
