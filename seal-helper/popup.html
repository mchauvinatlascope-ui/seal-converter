<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seal Helper</title>
<style>
  :root { --bg:#fff; --fg:#1b1d21; --fg2:#5d626b; --line:#e4e4e0; --on:#1b1d21; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1e22; --fg:#eceef1; --fg2:#a9afb9; --line:#30333a; --on:#eceef1; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 300px; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header b { font-size: 14px; flex: 1; }
  header span { color: var(--fg2); font-size: 11.5px; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-of-type { border-bottom: 0; }
  .row div { flex: 1; }
  .row small { display: block; color: var(--fg2); font-size: 12px; }
  .row.off { opacity: .45; pointer-events: none; }
  input[type="checkbox"] { appearance: none; flex: none; width: 30px; height: 18px; margin: 1px 0 0; border-radius: 9px; background: var(--line); position: relative; cursor: pointer; transition: background .12s; }
  input[type="checkbox"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); transition: transform .12s; }
  input[type="checkbox"]:checked { background: var(--on); }
  input[type="checkbox"]:checked::after { transform: translateX(12px); }
  input[type="checkbox"]:focus-visible { outline: 2px solid #2d72d2; outline-offset: 2px; }
  footer { padding: 10px 14px 12px; color: var(--fg2); font-size: 11.5px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <header><b>Seal Helper</b><span>v0.1</span><input type="checkbox" id="on" aria-label="Seal Helper on"></header>
  <label class="row" for="doc"><div>Clean documents<small>Change bars show on hover, dash lines become a thin rule, tables get a header row.</small></div><input type="checkbox" id="doc"></label>
  <label class="row" for="dates"><div>Short dates and titles<small>No time zone on every date; changeset titles without the repeated number.</small></div><input type="checkbox" id="dates"></label>
  <label class="row" for="info"><div>Info panel closed<small>Closes it when you open a record. Open it again whenever you need it.</small></div><input type="checkbox" id="info"></label>
  <label class="row" for="quiet"><div>Quieter lists<small>Empty changesets and Untitled or test drafts are dimmed, never hidden.</small></div><input type="checkbox" id="quiet"></label>
  <footer>Only changes how Seal looks in this browser. Nothing is written to Seal or sent anywhere.</footer>
  <script src="popup.js"></script>
</body>
</html>
