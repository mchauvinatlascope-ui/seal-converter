<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seal Helper</title>
<style>
  :root { --bg:#fff; --fg:#1b1d21; --fg2:#5d626b; --fg3:#8f959f; --line:#e4e4e0; --on:#1b1d21; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1e22; --fg:#eceef1; --fg2:#a9afb9; --fg3:#7d8592; --line:#30333a; --on:#eceef1; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 310px; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header b { font-size: 14px; flex: 1; }
  header span { color: var(--fg2); font-size: 11.5px; }
  h2 { margin: 0; padding: 12px 14px 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg3); }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 14px; cursor: pointer; }
  .row div { flex: 1; }
  .row small { display: block; color: var(--fg2); font-size: 12px; }
  .off .row { opacity: .45; pointer-events: none; }
  input[type="checkbox"] { appearance: none; flex: none; width: 30px; height: 18px; margin: 1px 0 0; border-radius: 9px; background: var(--line); position: relative; cursor: pointer; transition: background .12s; }
  input[type="checkbox"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); transition: transform .12s; }
  input[type="checkbox"]:checked { background: var(--on); }
  input[type="checkbox"]:checked::after { transform: translateX(12px); }
  input[type="checkbox"]:focus-visible { outline: 2px solid #2d72d2; outline-offset: 2px; }
  footer { margin-top: 6px; padding: 10px 14px 12px; color: var(--fg2); font-size: 11.5px; border-top: 1px solid var(--line); }
  #state { display: flex; align-items: flex-start; gap: 10px; margin: 10px 14px 0; padding: 9px 11px; border-radius: 8px; background: #f3f3f0; font-size: 12.5px; line-height: 1.4; }
  @media (prefers-color-scheme: dark) { #state { background: #25282e; } }
  #state i { flex: none; width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; background: #9aa0a8; }
  #state.ok i { background: #1f9d5a; } #state.warn i { background: #e0a21b; } #state.off i { background: #c4c7cc; }
  #state div { flex: 1; } #state b { display: block; font-weight: 600; } #state span { color: var(--fg2); font-size: 12px; }
  #state button { margin-top: 6px; font: inherit; font-size: 12px; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  #state button:hover { border-color: #b9bcc1; }
  #state[hidden] { display: none; }
  #diag { display: none; margin: 8px 14px 0; width: calc(100% - 28px); height: 150px; font: 10.5px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 6px; color: var(--fg); background: var(--bg); resize: vertical; }
  #diag.show { display: block; }
  #tools { display: flex; align-items: center; gap: 10px; margin: 8px 14px 0; font-size: 11.5px; color: var(--fg2); }
  #tools[hidden] { display: none; }
  #tools button { flex: none; font: inherit; font-size: 12px; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
</style>
</head>
<body>
  <header><b>Seal Helper</b><span>v1.5.4</span><input type="checkbox" id="on" aria-label="Seal Helper on"></header>
  <div id="state" hidden><i></i><div><b></b><span></span></div></div>
  <textarea id="diag" readonly aria-label="Diagnostic"></textarea>
  <div id="tools" hidden></div>
  <div id="all">
    <h2>Layout</h2>
    <label class="row" for="side"><div>New sidebar<small>The lab notebook sections first (Projects, Experiments, Protocols, Inventory), then Today, My work, To publish, your recent records and favourites. Ctrl K searches.</small></div><input type="checkbox" id="side"></label>
    <label class="row" for="home"><div>Open on Today<small>The dashboard first when you arrive in Seal. Off: the lab notebook page opens as usual.</small></div><input type="checkbox" id="home"></label>
    <label class="row" for="appmenu"><div>One menu for the lab notebook<small>The notebook page uses the sidebar instead of its own menu.</small></div><input type="checkbox" id="appmenu"></label>
    <label class="row" for="props"><div>Record header and outline<small>Key fields at the top of a record, its headings on the right.</small></div><input type="checkbox" id="props"></label>
    <h2>Clean up</h2>
    <label class="row" for="doc"><div>Clean documents<small>Change bars on hover, dash lines as a thin rule, table header row, clean printing (Print in the record bar).</small></div><input type="checkbox" id="doc"></label>
    <label class="row" for="dates"><div>Short dates and titles<small>No time zone on every date, no repeated change number.</small></div><input type="checkbox" id="dates"></label>
    <label class="row" for="info"><div>Info panel closed<small>Closed when you open a record; open it whenever you need it.</small></div><input type="checkbox" id="info"></label>
    <label class="row" for="quiet"><div>Quieter lists<small>Empty changes and Untitled or test drafts dimmed, never hidden.</small></div><input type="checkbox" id="quiet"></label>
  </div>
  <footer>Only changes how Seal looks in this browser. Nothing is written to Seal or sent anywhere.</footer>
  <script src="popup.js"></script>
</body>
</html>
