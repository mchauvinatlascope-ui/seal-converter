<body><main><div data-testid="entity-top-navbar"><span data-title-text>Plate-like record</span></div>
<div data-testid="native-document-editor"><div contenteditable="true" data-testid="plate-content" data-native-document-root data-editor-engine="plate">
<div data-native-block-type="h2" class="slate-h2">Staining</div>
<div data-native-block-type="p" class="slate-p">Keep everything on ice and protect the antibodies from light during the whole protocol.</div>
<div data-native-block-type="p" class="slate-p" style="margin-left: 24px; display: list-item; list-style-type: decimal;">Add 50 µL of Fc block to each well.</div>
<div data-native-block-type="p" class="slate-p" style="margin-left: 24px; display: list-item; list-style-type: decimal;">Incubate 10 min at 4 °C.</div>
<div data-native-block-type="p" class="slate-p">Wash buffer is PBS with 2 % FCS.</div>
<div data-native-block-type="p" class="slate-p" style="margin-left: 24px; display: list-item; list-style-type: decimal;">Wash twice.</div>
</div></div></main></body></html>
